name: Manual CLI Scrape Only (No Server)

on:
  # Manual-only workflow (hourly cron is handled by live_server_demo.yml)
  workflow_dispatch:
    inputs:
      add_fanpage_url:
        description: "Optional: Add a new Facebook Fanpage URL before scraping"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Ho_Chi_Minh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies & Playwright Chromium
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Add new fanpage URL (if provided via manual trigger)
        if: ${{ github.event.inputs.add_fanpage_url != '' }}
        run: |
          python main.py add "${{ github.event.inputs.add_fanpage_url }}"

      - name: Run Facebook Fanpage Scrape Cycle
        run: |
          python main.py fetch
          python main.py list

      - name: Commit updated SQLite DB & XML RSS feeds back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rss_bot.db feeds/
          if git diff --staged --quiet; then
            echo "No new posts or database changes to commit."
          else
            git commit -m "chore(rss): auto-update scraped posts and XML feeds [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin ${{ github.ref_name }}
          fi
