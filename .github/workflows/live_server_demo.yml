name: Scheduled Crawler (08:00, 14:00, 20:00 ICT) -> Sync to 24/7 Ngrok & GitHub Pages

on:
  # Trigger ~13 minutes early at off-peak minute (:47) so GitHub Actions queue delay +
  # setup (~2-3 mins) finish in time for 08:00, 14:00, and 20:00 Asia/Ho_Chi_Minh (UTC+7).
  schedule:
    - cron: "47 0 * * *"   # ~07:47 ICT -> crawls & deploys for 08:00 ICT
    - cron: "47 6 * * *"   # ~13:47 ICT -> crawls & deploys for 14:00 ICT
    - cron: "47 12 * * *"  # ~19:47 ICT -> crawls & deploys for 20:00 ICT
  workflow_dispatch:
    inputs:
      stay_awake_minutes:
        description: "Fallback awake minutes if 24/7 Ngrok server is offline (default: 10)"
        required: false
        default: "10"

concurrency:
  group: live-websocket-server
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scheduled-scrape-and-serve:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Ho_Chi_Minh
      NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
      NGROK_DOMAIN: ${{ secrets.NGROK_DOMAIN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies & Playwright
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Detect 24/7 Ngrok Server, Crawl & Deploy Data
        run: |
          RAW_DOMAIN="${NGROK_DOMAIN:-stimulus-rectangle-ship.ngrok-free.dev}"
          CLEAN_DOMAIN="${RAW_DOMAIN#https://}"
          CLEAN_DOMAIN="${CLEAN_DOMAIN#http://}"
          CLEAN_DOMAIN="${CLEAN_DOMAIN%/}"
          TARGET_URL="https://$CLEAN_DOMAIN"

          LIVE_SERVER_UP="false"
          if curl -fsS --max-time 8 -H "ngrok-skip-browser-warning: true" "$TARGET_URL/api/schedule" >/dev/null 2>&1; then
            LIVE_SERVER_UP="true"
          fi

          echo "LIVE_SERVER_UP=$LIVE_SERVER_UP" >> "$GITHUB_ENV"

          if [ "$LIVE_SERVER_UP" = "true" ]; then
            echo "🟢 24/7 Ngrok server is ONLINE at $TARGET_URL — running 3x/day crawler & pushing data..."
            PUBLIC_URL="$TARGET_URL"
            WS_URL="${PUBLIC_URL/https:\/\//wss:\/\/}/ws"
            TUNNEL_MODE="Always-On External Ngrok Server (Synced via API)"

            # 1. Mirror fanpage list from the live Ngrok server (add new pages AND delete removed pages)
            TARGET_URL_VAL="$TARGET_URL" python - << 'PY'
          import json, os, shutil, urllib.request
          from config import FEEDS_DIR
          from database import add_fanpage, init_db, list_fanpages, remove_fanpage
          from database.db import normalize_fb_url
          from events import purge_fanpage_events, sync_all_event_folders
          from rss import generate_all_rss

          init_db()
          url = os.environ.get("TARGET_URL_VAL") or f"https://{os.environ.get('CLEAN_DOMAIN_VAL')}"
          req = urllib.request.Request(f"{url}/api/fanpages", headers={"ngrok-skip-browser-warning": "true"})
          try:
              with urllib.request.urlopen(req, timeout=15) as r:
                  fps = json.loads(r.read().decode("utf-8"))
              if not isinstance(fps, list):
                  raise ValueError("Unexpected /api/fanpages response format")

              live_urls = set()
              live_slugs = set()
              for fp in fps:
                  raw_url = fp.get("url")
                  if not raw_url:
                      continue
                  canon_url, slug = normalize_fb_url(raw_url)
                  live_urls.add(canon_url)
                  live_slugs.add(slug)
                  if fp.get("slug"):
                      live_slugs.add(fp["slug"])
                  add_fanpage(raw_url, fp.get("name"))

              removed_count = 0
              for local_fp, _ in list_fanpages(active_only=False):
                  if local_fp.url not in live_urls:
                      remove_fanpage(str(local_fp.id))
                      (FEEDS_DIR / f"{local_fp.slug}.xml").unlink(missing_ok=True)
                      purge_fanpage_events(local_fp.id, local_fp.slug)
                      removed_count += 1
                      print(f"Removed deleted fanpage from Actions DB: {local_fp.url}")

              # Remove any stale orphan XML or fanpage folders not in live_slugs
              reserved_dirs = {"all", "emails", "fanpages", "inbox", "users"}
              for xml_file in FEEDS_DIR.glob("*.xml"):
                  stem = xml_file.stem
                  if stem == "all" or stem.startswith("user_"):
                      continue
                  if stem not in live_slugs:
                      xml_file.unlink(missing_ok=True)
              for d in FEEDS_DIR.iterdir():
                  if d.is_dir() and d.name not in reserved_dirs and d.name not in live_slugs:
                      shutil.rmtree(d, ignore_errors=True)
              fanpages_dir = FEEDS_DIR / "fanpages"
              if fanpages_dir.exists():
                  for d in fanpages_dir.iterdir():
                      if d.is_dir() and d.name not in live_slugs:
                          shutil.rmtree(d, ignore_errors=True)

              if removed_count:
                  generate_all_rss()
                  sync_all_event_folders()
              print(f"Synced {len(fps)} active fanpage(s) from live server (removed {removed_count}).")
          except Exception as exc:
              print(f"Warning syncing fanpages from live server: {exc}")
          PY

            # 2. Run Playwright crawler + extractor locally inside GitHub Actions (~2-5 mins)
            python main.py fetch
            python main.py list

            # 3. Push freshly scraped posts & metadata to the 24/7 Ngrok server
            SYNC_RESULT=$(TARGET_URL_VAL="$TARGET_URL" python - << 'PY'
          import json, os, urllib.request
          from database import list_fanpages, get_posts_for_fanpage
          payload = {"fanpages": []}
          for fp, _ in list_fanpages(active_only=True):
              posts = get_posts_for_fanpage(fp.id, limit=50)
              payload["fanpages"].append({
                  "url": fp.url,
                  "name": fp.name,
                  "posts": [
                      {
                          "post_id": p.post_id,
                          "post_url": p.post_url,
                          "content": p.content,
                          "media_urls": p.media_urls,
                          "published_at": p.published_at.isoformat() if p.published_at else None,
                      }
                      for p in posts
                  ],
              })
          target = os.environ["TARGET_URL_VAL"]
          headers = {
              "Content-Type": "application/json",
              "ngrok-skip-browser-warning": "true",
              "X-Admin-Token": os.environ.get("ADMIN_TOKEN", ""),
          }
          req = urllib.request.Request(
              f"{target}/api/admin/import-crawl",
              data=json.dumps(payload).encode("utf-8"),
              headers=headers,
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=120) as r:
                  print(r.read().decode("utf-8"))
          except Exception as exc:
              print(json.dumps({"status": "push_failed", "detail": str(exc)}))
          PY
            )
            echo "Push to 24/7 Ngrok server result: $SYNC_RESULT"
            SCRAPE_RESULT="$SYNC_RESULT"
          else
            echo "🟡 24/7 Ngrok server is OFFLINE — falling back to temporary runner Ngrok window..."
            curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc \
              | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
            echo "deb https://ngrok-agent.s3.amazonaws.com buster main" \
              | sudo tee /etc/apt/sources.list.d/ngrok.list
            sudo apt update && sudo apt install -y ngrok

            nohup python main.py serve --host 127.0.0.1 --port 8000 --hours "8,14,20" > server.log 2>&1 < /dev/null &
            for i in {1..15}; do
              if curl -fsS http://127.0.0.1:8000/api/schedule >/dev/null 2>&1; then
                break
              fi
              sleep 1
            done

            if [ -n "$NGROK_AUTHTOKEN" ]; then
              ngrok config add-authtoken "$NGROK_AUTHTOKEN"
              nohup ngrok http --url="https://$CLEAN_DOMAIN" 8000 --log=stdout > tunnel.log 2>&1 < /dev/null &
              sleep 4
              PUBLIC_URL="https://$CLEAN_DOMAIN"
              TUNNEL_MODE="Fallback Runner Static Domain (ngrok)"
            else
              curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
              sudo dpkg -i cloudflared.deb
              nohup cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8000 > tunnel.log 2>&1 < /dev/null &
              for i in {1..20}; do
                PUBLIC_URL=$(grep -o 'https://[-a-zA-Z0-9.]*\.trycloudflare\.com' tunnel.log | head -n 1 || true)
                if [ -n "$PUBLIC_URL" ]; then
                  break
                fi
                sleep 1
              done
              TUNNEL_MODE="Fallback Temporary Cloudflare Tunnel"
            fi

            WS_URL="${PUBLIC_URL/https:\/\//wss:\/\/}/ws"
            echo "🔍 Running fanpage crawler & unified event extractor..."
            SCRAPE_RESULT=$(curl -sS -X POST http://127.0.0.1:8000/api/scrape || echo '{"status":"error"}')
            echo "Scrape response: $SCRAPE_RESULT"
            python main.py list
          fi

          {
            echo "PUBLIC_URL=$PUBLIC_URL"
            echo "WS_URL=$WS_URL"
            echo "TUNNEL_MODE=$TUNNEL_MODE"
          } >> "$GITHUB_ENV"

          {
            echo "## 🚀 Scheduled Crawler & Ngrok Sync"
            echo ""
            echo "- **Ran At:** \`$(date '+%Y-%m-%d %H:%M:%S %Z (%z)')\`"
            echo "- **Mode:** $TUNNEL_MODE"
            echo "- **Sync Result:** \`$SCRAPE_RESULT\`"
            echo ""
            echo "| Endpoint | Link |"
            echo "| :--- | :--- |"
            echo "| 🌐 **Live Dashboard & Directory Tree** | [$PUBLIC_URL/]($PUBLIC_URL/) |"
            echo "| 📥 **Client Email Inbox (`POST`)** | \`$PUBLIC_URL/api/inbox\` |"
            echo "| 🗂️ **Directory Tree Index (`GET`)** | [$PUBLIC_URL/api/tree]($PUBLIC_URL/api/tree) |"
            echo "| 📅 **All Unified Events JSON** | [$PUBLIC_URL/feeds/all/events.json]($PUBLIC_URL/feeds/all/events.json) |"
            echo "| 📧 **Email Events JSON** | [$PUBLIC_URL/feeds/emails/events.json]($PUBLIC_URL/feeds/emails/events.json) |"
            echo "| ⚙️ **Admin Panel** | [$PUBLIC_URL/admin]($PUBLIC_URL/admin) |"
            echo "| ⏰ **Schedule Status** | [$PUBLIC_URL/api/schedule]($PUBLIC_URL/api/schedule) |"
            echo "| 📖 **OpenAPI / Swagger Docs** | [$PUBLIC_URL/docs]($PUBLIC_URL/docs) |"
            echo "| 🔌 **WebSocket Feed** | \`$WS_URL\` |"
            echo "| 📰 **Combined RSS XML Feed** | [$PUBLIC_URL/feeds/all.xml]($PUBLIC_URL/feeds/all.xml) |"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          TARGET_URL_VAL: https://${{ secrets.NGROK_DOMAIN || 'stimulus-rectangle-ship.ngrok-free.dev' }}
          CLEAN_DOMAIN_VAL: ${{ secrets.NGROK_DOMAIN || 'stimulus-rectangle-ship.ngrok-free.dev' }}

      - name: Fallback Stay-Awake Window (Only when 24/7 Ngrok host was offline)
        if: env.LIVE_SERVER_UP != 'true'
        run: |
          WAIT_MIN="${{ github.event.inputs.stay_awake_minutes }}"
          if [ -z "$WAIT_MIN" ]; then
            WAIT_MIN=10
          fi

          NOW_TS=$(date +%s)
          CURRENT_HOUR=$(date +%H | sed 's/^0*//')
          CURRENT_MINUTE=$(date +%M | sed 's/^0*//')
          CURRENT_SECOND=$(date +%S | sed 's/^0*//')
          CURRENT_HOUR=${CURRENT_HOUR:-0}
          CURRENT_MINUTE=${CURRENT_MINUTE:-0}
          CURRENT_SECOND=${CURRENT_SECOND:-0}

          MIN_WAIT_SEC=$(( WAIT_MIN * 60 ))
          TARGET_WAIT_SEC=$MIN_WAIT_SEC

          if [ "$CURRENT_MINUTE" -ge 45 ] && { [ "$CURRENT_HOUR" -eq 7 ] || [ "$CURRENT_HOUR" -eq 13 ] || [ "$CURRENT_HOUR" -eq 19 ]; }; then
            TARGET_WAIT_SEC=$(( (65 - CURRENT_MINUTE) * 60 - CURRENT_SECOND ))
          elif [ "$CURRENT_MINUTE" -lt 10 ]; then
            TARGET_WAIT_SEC=$(( (10 - CURRENT_MINUTE) * 60 - CURRENT_SECOND ))
          fi

          if [ "$TARGET_WAIT_SEC" -gt "$MIN_WAIT_SEC" ]; then
            SLEEP_SEC=$TARGET_WAIT_SEC
          else
            SLEEP_SEC=$MIN_WAIT_SEC
          fi

          MAX_SLEEP_SEC=$(( 18 * 60 ))
          if [ "$SLEEP_SEC" -gt "$MAX_SLEEP_SEC" ]; then
            SLEEP_SEC=$MAX_SLEEP_SEC
          fi

          END_TIME=$(( NOW_TS + SLEEP_SEC ))
          echo "🟢 Fallback runner Ngrok server ($PUBLIC_URL) waiting until $(date -d @$END_TIME '+%H:%M:%S %z') (${SLEEP_SEC}s)..."

          LAST_LINE=0
          while [ $(date +%s) -lt $END_TIME ]; do
            if [ -f server.log ]; then
              CURRENT_LINES=$(wc -l < server.log)
              if [ "$CURRENT_LINES" -gt "$LAST_LINE" ]; then
                tail -n +$((LAST_LINE + 1)) server.log
                LAST_LINE=$CURRENT_LINES
              fi
            fi
            sleep 10
          done

      - name: Save SQLite DB & Distributed JSON/XML Feeds
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rss_bot.db feeds/
          if git diff --staged --quiet; then
            echo "No database or feed changes to commit."
          else
            git commit -m "chore(rss): scheduled crawl & feed sync at $(date '+%Y-%m-%d %H:%M') [skip ci]"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin ${{ github.ref_name }} || true
          fi

      - name: Prepare GitHub Pages Payload (Distributed Directory Tree)
        if: always()
        run: |
          rm -rf site && mkdir -p site/all site/fanpages site/emails site/inbox site/users
          for f in feeds/*.xml; do
            [ -e "$f" ] || continue
            NAME=$(basename "$f")
            case "$NAME" in
              all.xml)    cp "$f" site/all/ ;;
              user_*.xml) cp "$f" site/users/ ;;
              *)          cp "$f" site/fanpages/ ;;
            esac
          done
          if [ -f "feeds/all/events.json" ]; then
            cp "feeds/all/events.json" "site/all/events.json"
          fi
          if [ -d "feeds/fanpages" ]; then
            cp -r feeds/fanpages/* site/fanpages/ 2>/dev/null || true
          fi
          for d in feeds/*/; do
            [ -d "$d" ] || continue
            SLUG=$(basename "$d")
            case "$SLUG" in
              all|fanpages|emails|inbox|users) continue ;;
            esac
            if [ -f "$d/events.json" ]; then
              mkdir -p "site/fanpages/$SLUG"
              cp "$d/events.json" "site/fanpages/$SLUG/events.json"
            fi
          done
          if [ -d "feeds/emails" ]; then
            cp -r feeds/emails/* site/emails/ 2>/dev/null || true
          fi
          if [ -d "feeds/inbox" ]; then
            cp -r feeds/inbox/* site/inbox/ 2>/dev/null || true
          fi

          LIVE_URL="${PUBLIC_URL:-https://stimulus-rectangle-ship.ngrok-free.dev}"
          UPDATED=$(date '+%Y-%m-%d %H:%M %Z')
          cat << EOF > site/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width,initial-scale=1" />
            <title>Event Extractor — Distributed Directory Tree</title>
            <style>
              body { font-family: system-ui, -apple-system, sans-serif; background: linear-gradient(135deg, #f6f3ff 0%, #eaf4ff 55%, #fff1f6 100%); color: #3b3552; margin: 0; padding: 36px 24px; }
              .wrap { max-width: 1080px; margin: 0 auto; }
              .card { background: #fff; border-radius: 18px; padding: 24px 28px; margin-bottom: 20px; box-shadow: 0 6px 22px #b8a9e822; }
              h1 { margin: 0 0 8px 0; font-size: 24px; }
              h2 { color: #6957b8; margin: 0 0 12px 0; font-family: ui-monospace, Consolas, monospace; font-size: 18px; }
              .muted { color: #7e7896; margin: 0 0 16px 0; font-size: 14px; }
              .btn-row { display: flex; flex-wrap: wrap; gap: 10px; }
              .btn { display: inline-block; padding: 10px 16px; border-radius: 10px; background: #7c69ef; color: #fff; font-weight: 600; font-size: 14px; text-decoration: none; }
              .btn.secondary { background: #ece8ff; color: #5242a8; }
              ul { list-style: none; padding-left: 8px; margin: 0; }
              li { margin: 8px 0; font-family: ui-monospace, Consolas, monospace; font-size: 14px; }
              a { color: #4b6fd4; text-decoration: none; }
              a:hover { text-decoration: underline; }
            </style>
          </head>
          <body>
            <div class="wrap">
              <div class="card">
                <h1>Event Extractor — Distributed Directory Tree</h1>
                <p class="muted">Updated at <strong>$UPDATED</strong> · Scheduled daily at <strong>08:00, 14:00, 20:00 ICT (UTC+7)</strong>.</p>
                <div class="btn-row">
                  <a class="btn" href="$LIVE_URL/" target="_blank">🚀 Open Live Ngrok Dashboard &amp; Inbox</a>
                  <a class="btn secondary" href="$LIVE_URL/api/tree" target="_blank">🗂️ API Directory Tree</a>
                  <a class="btn secondary" href="$LIVE_URL/admin" target="_blank">⚙️ Admin Panel</a>
                  <a class="btn secondary" href="all/events.json" target="_blank">📅 All Events JSON</a>
                </div>
              </div>
          EOF
          for d in all fanpages emails inbox users; do
            echo "<div class=\"card\"><h2>📂 /$d/</h2><ul>" >> site/index.html
            for f in $(find "site/$d" -type f \( -name "*.json" -o -name "*.xml" \) | sort); do
              [ -e "$f" ] || continue
              N=${f#site/$d/}
              echo "<li>├─ 📄 <a href=\"$d/$N\">$d/$N</a></li>" >> site/index.html
            done
            echo '</ul></div>' >> site/index.html
          done
          echo '</div></body></html>' >> site/index.html

      - name: Upload GitHub Pages Artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: "site"

  deploy-github-pages:
    needs: scheduled-scrape-and-serve
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
