name: Hourly Scrape & 5-Minute Live RSS/WebSocket Server (X:00 - X:05)

on:
  # Activates every hour at X:00 (minute 0)
  schedule:
    - cron: "0 * * * *"
  # Also allows manual trigger anytime for testing
  workflow_dispatch:
    inputs:
      stay_awake_minutes:
        description: "Minutes to stay awake waiting for client RSS/WebSocket requests (default: 5)"
        required: false
        default: "5"

concurrency:
  group: live-websocket-server
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  hourly-scrape-and-serve:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Ho_Chi_Minh
      NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
      NGROK_DOMAIN: ${{ secrets.NGROK_DOMAIN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies, Playwright & Tunnel CLI
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

          curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc \
            | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" \
            | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update && sudo apt install -y ngrok

          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Start Live Server, Open Public Tunnel & Scrape Fanpages
        run: |
          # 1. Start the FastAPI + WebSocket + RSS server immediately so clients can connect right away
          nohup python main.py serve --host 127.0.0.1 --port 8000 --interval 3600 > server.log 2>&1 < /dev/null &
          sleep 3

          PUBLIC_URL=""

          # 2. Open permanent ngrok domain (or Cloudflare fallback)
          if [ -n "$NGROK_AUTHTOKEN" ] && [ -n "$NGROK_DOMAIN" ]; then
            ngrok config add-authtoken "$NGROK_AUTHTOKEN"
            CLEAN_DOMAIN="${NGROK_DOMAIN#https://}"
            CLEAN_DOMAIN="${CLEAN_DOMAIN#http://}"
            CLEAN_DOMAIN="${CLEAN_DOMAIN%/}"
            nohup ngrok http --url="https://$CLEAN_DOMAIN" 8000 --log=stdout > tunnel.log 2>&1 < /dev/null &
            sleep 4
            PUBLIC_URL="https://$CLEAN_DOMAIN"
            TUNNEL_MODE="Permanent Static Domain (ngrok)"
          else
            nohup cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8000 > tunnel.log 2>&1 < /dev/null &
            for i in {1..20}; do
              PUBLIC_URL=$(grep -o 'https://[-a-zA-Z0-9.]*\.trycloudflare\.com' tunnel.log | head -n 1 || true)
              if [ -n "$PUBLIC_URL" ]; then
                break
              fi
              sleep 1
            done
            TUNNEL_MODE="Temporary Cloudflare Tunnel"
          fi

          WS_URL="${PUBLIC_URL/https:\/\//wss:\/\/}/ws/user_1"

          echo "=================================================================="
          echo "⏰ SERVER ACTIVATED AT : $(date '+%Y-%m-%d %H:%M:%S %z')"
          echo "🌐 TUNNEL MODE        : $TUNNEL_MODE"
          echo "🚀 LIVE DASHBOARD URL : $PUBLIC_URL"
          echo "🔌 WEBSOCKET ENDPOINT : $WS_URL"
          echo "📰 ALL RSS XML FEED   : $PUBLIC_URL/feeds/all.xml"
          echo "📰 USER RSS XML FEED  : $PUBLIC_URL/users/user_1/rss.xml"
          echo "=================================================================="

          {
            echo "### 🚀 Hourly Facebook RSS Server Activated!"
            echo "- **Activated At:** \`$(date '+%Y-%m-%d %H:%M:%S %z')\`"
            echo "- **Live Dashboard:** [$PUBLIC_URL]($PUBLIC_URL)"
            echo "- **WebSocket Endpoint:** \`$WS_URL\`"
            echo "- **Combined RSS XML Feed:** [$PUBLIC_URL/feeds/all.xml]($PUBLIC_URL/feeds/all.xml)"
            echo "- **User RSS XML Feed:** [$PUBLIC_URL/users/user_1/rss.xml]($PUBLIC_URL/users/user_1/rss.xml)"
          } >> "$GITHUB_STEP_SUMMARY"

          # 3. Trigger immediate scrape inside the running server (updates SQLite + .xml feeds + pushes to WebSockets)
          echo "🔍 Scraping newly uploaded posts across tracked fanpages..."
          curl -sS -X POST http://127.0.0.1:8000/api/scrape
          echo ""
          python main.py list

      - name: Stay Awake Until X:05 (5-Minute Window for Client Requests)
        run: |
          WAIT_MIN="${{ github.event.inputs.stay_awake_minutes }}"
          if [ -z "$WAIT_MIN" ]; then
            WAIT_MIN=5
          fi

          NOW_TS=$(date +%s)
          CURRENT_MINUTE=$(date +%M | sed 's/^0*//')
          CURRENT_SECOND=$(date +%S | sed 's/^0*//')
          CURRENT_MINUTE=${CURRENT_MINUTE:-0}
          CURRENT_SECOND=${CURRENT_SECOND:-0}

          # Calculate seconds remaining until X:05:59, and ensure at least WAIT_MIN (5 mins) awake window
          MIN_WAIT_SEC=$(( WAIT_MIN * 60 ))
          if [ "$CURRENT_MINUTE" -lt 5 ]; then
            UNTIL_X05=$(( (5 - CURRENT_MINUTE) * 60 - CURRENT_SECOND ))
          else
            UNTIL_X05=$MIN_WAIT_SEC
          fi

          if [ "$UNTIL_X05" -gt "$MIN_WAIT_SEC" ]; then
            SLEEP_SEC=$UNTIL_X05
          else
            SLEEP_SEC=$MIN_WAIT_SEC
          fi

          END_TIME=$(( NOW_TS + SLEEP_SEC ))
          echo "🟢 Server is now waiting for client RSS/WebSocket requests until $(date -d @$END_TIME '+%H:%M:%S %z') (${SLEEP_SEC}s)..."

          LAST_LINE=0
          while [ $(date +%s) -lt $END_TIME ]; do
            if [ -f server.log ]; then
              CURRENT_LINES=$(wc -l < server.log)
              if [ "$CURRENT_LINES" -gt "$LAST_LINE" ]; then
                tail -n +$((LAST_LINE + 1)) server.log
                LAST_LINE=$CURRENT_LINES
              fi
            fi
            sleep 10
          done

          echo "💤 Client request window ended at $(date '+%Y-%m-%d %H:%M:%S %z'). Preparing to sleep..."

      - name: Save SQLite DB & XML RSS Feeds Before Sleeping
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rss_bot.db feeds/
          if git diff --staged --quiet; then
            echo "No database or XML feed changes to commit."
          else
            git commit -m "chore(rss): hourly scrape & client sync at $(date '+%Y-%m-%d %H:%M') [skip ci]"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin ${{ github.ref_name }} || true
          fi

      - name: Prepare GitHub Pages Payload
        if: always()
        run: |
          # Generate an index.html inside feeds/ for friendly browsing on GitHub Pages
          cat << 'EOF' > feeds/index.html
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Facebook Fanpage RSS Feeds (24/7)</title>
            <style>
              body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; padding: 30px; }
              .card { background: #1e293b; padding: 20px; border-radius: 12px; max-width: 600px; margin: 0 auto; }
              a { color: #60a5fa; text-decoration: none; font-size: 16px; }
              li { margin: 12px 0; }
            </style>
          </head>
          <body>
            <div class="card">
              <h2>📡 Facebook Fanpage RSS Feeds (Available 24/7)</h2>
              <p>Feeds updated automatically every hour via GitHub Actions.</p>
              <ul>
          EOF

          for f in feeds/*.xml; do
            [ -e "$f" ] || continue
            NAME=$(basename "$f")
            echo "      <li><a href=\"$NAME\" target=\"_blank\">$NAME</a></li>" >> feeds/index.html
          done

          cat << 'EOF' >> feeds/index.html
              </ul>
            </div>
          </body>
          </html>
          EOF

      - name: Upload GitHub Pages Artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: "feeds"

  deploy-github-pages:
    needs: hourly-scrape-and-serve
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
